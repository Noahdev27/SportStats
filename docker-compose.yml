services:
  postgres:
    image: postgres:16-alpine
    container_name: sportstats-db
    restart: unless-stopped
    environment:
      POSTGRES_USER: sportstats
      POSTGRES_PASSWORD: sportstats
      POSTGRES_DB: sportstats
    ports:
      - '5432:5432'
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./docker/init-test-db.sql:/docker-entrypoint-initdb.d/init-test-db.sql:ro
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U sportstats -d sportstats']
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  pgdata:
